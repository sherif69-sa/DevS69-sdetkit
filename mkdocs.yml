site_name: DevS69 SDETKit
site_description: Deterministic release confidence with machine-readable evidence and one repeatable command path from local to CI.
site_url: https://sherif69-sa.github.io/DevS69-sdetkit/
repo_name: sherif69-sa/DevS69-sdetkit
repo_url: https://github.com/sherif69-sa/DevS69-sdetkit
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
      auto_title: false
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  status:
    new: Recently updated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sherif69-sa/DevS69-sdetkit
      name: DevS69 SDETKit on GitHub

extra_css:
  - stylesheets/extra.css

