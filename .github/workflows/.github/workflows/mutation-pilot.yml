# Local equivalent: python scripts/mutation_pilot.py
name: Mutation Pilot (report only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mutation-pilot.yml'
      - 'scripts/mutation_pilot.py'
      - 'tests/test_mutation_pilot.py'
permissions:
  contents: read
concurrency:
  group: mutation-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pilot dependencies
        run: python -m pip install -c constraints-ci.txt -r requirements-test.txt -e .
      - name: Run focused report-only pilot
        id: mutation
        continue-on-error: true
        run: python scripts/mutation_pilot.py
      - name: Publish honest pilot summary
        if: always()
        env:
          PILOT_OUTCOME: ${{ steps.mutation.outcome }}
        run: |
          echo "Pilot step outcome: $PILOT_OUTCOME (report-only, not a merge gate)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/mutation-pilot/summary.md ]; then
            cat build/mutation-pilot/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report was produced. This is a tool/setup failure, not a mutation score.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-pilot
          path: build/mutation-pilot/
          retention-days: 14
          if-no-files-found: warn
