# Local equivalent command:
#   python -m sdetkit workflow-governance-report --root . --format text
#   See docs/ci/workflow-local-equivalents.md#pre-commit-autoupdate for workflow-specific operator notes.
name: Pre-commit Autoupdate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    env:
      HAS_PR_TOKEN: ${{ secrets.PRE_COMMIT_AUTOUPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install -c constraints-ci.txt pre-commit

      # ruff and mypy hook revs follow their pins in constraints-ci.txt, which Dependabot
      # updates; bumping them here alone would fail tests/test_toolchain_pin_contract.py.
      - name: Update hooks
        run: pre-commit autoupdate --repo https://github.com/pre-commit/pre-commit-hooks

      # A pull request opened with GITHUB_TOKEN never starts CI.
      - name: Warn when CI will not run
        if: env.HAS_PR_TOKEN != 'true'
        run: echo "::warning::PRE_COMMIT_AUTOUPDATE_TOKEN is not set; CI will not run on this pull request. See CONTRIBUTING.md."

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.PRE_COMMIT_AUTOUPDATE_TOKEN || github.token }}
          commit-message: "chore(pre-commit): autoupdate hooks"
          title: "chore(pre-commit): autoupdate hooks"
          body: |
            Automated pre-commit hook update to keep local/CI lint and security tooling current.
          branch: "bot/pre-commit-autoupdate"
          labels: |
            dependencies
            automation
