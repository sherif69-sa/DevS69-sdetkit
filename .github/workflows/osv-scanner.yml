# Local equivalent command:
#   python -m sdetkit workflow-governance-report --root . --format text
#   See docs/ci/workflow-local-equivalents.md#osv-scanner for workflow-specific operator notes.
name: OSV Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: OSV scheduled/repo scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # --no-resolve: scan the pins in requirements*.txt as written. uv.lock already
      # holds the full resolved graph; osv-scanner's own deps.dev resolution of the
      # loose requirements reported versions the lock does not use and can stall.
      scan-args: |-
        -r
        --no-resolve
        ./
      fail-on-vuln: false
      upload-sarif: true
