# Local equivalent command:
#   python -m sdetkit workflow-governance-report --root . --format text
#   See docs/ci/workflow-local-equivalents.md#dependency-auto-merge for workflow-specific operator notes.
name: Dependency Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for safe updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # Keep this helper best-effort: repository auto-merge may be disabled
        # while protected-branch manual merge remains the authority.
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d  # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
          pull-request-number: ${{ github.event.pull_request.number }}

  refresh-lock:
    # Dependabot's pip updates change pyproject.toml and constraints-ci.txt but
    # not uv.lock, so CI's `uv lock --check` fails until the lock is refreshed.
    # Nor the ruff and mypy hook revs in .pre-commit-config.yaml, which must match
    # their pins (tests/test_toolchain_pin_contract.py).
    # Commits pushed with GITHUB_TOKEN never start CI, so the push uses
    # DEPENDENCY_LOCK_TOKEN (a Dependabot secret). Without it, the job comments
    # the command to run instead. The bot's own push is not by Dependabot, so it
    # does not run this job again.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_LOCK_TOKEN: ${{ secrets.DEPENDENCY_LOCK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.DEPENDENCY_LOCK_TOKEN || github.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Refresh uv.lock
        id: lock
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Only refresh pull requests that touch nothing but dependency files.
          other="$(git diff --name-only "$BASE_SHA"...HEAD | grep -vxE 'pyproject\.toml|requirements(-[a-z]+)?\.txt|constraints-ci\.txt|uv\.lock' || true)"
          if [ -n "$other" ]; then
            echo "Not a dependency-only pull request; leaving uv.lock alone:"
            echo "$other"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install -c constraints-ci.txt uv
          bash scripts/refresh_uv_lock.sh
          python scripts/sync_pre_commit_revs.py
          if git diff --quiet -- uv.lock .pre-commit-config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the refreshed lock
        if: steps.lock.outputs.changed == 'true' && env.HAS_LOCK_TOKEN == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh uv.lock and pinned hook revs" -- uv.lock .pre-commit-config.yaml
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Ask for a lock refresh
        if: steps.lock.outputs.changed == 'true' && env.HAS_LOCK_TOKEN != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- sdetkit:lock-refresh -->';
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            if (comments.some((comment) => comment.body.includes(marker))) {
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                marker,
                '`uv.lock` or the pinned pre-commit hook revs are out of date with this update, so CI will fail.',
                'Run `make lock` on this branch and push the result.',
                'To have this done automatically, add a `DEPENDENCY_LOCK_TOKEN` Dependabot secret (see CONTRIBUTING.md).',
              ].join('\n'),
            });
