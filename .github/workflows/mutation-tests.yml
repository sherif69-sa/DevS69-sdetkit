name: Mutation Tests

on:
  pull_request:
    paths:
      - ".github/workflows/mutation-tests.yml"
      - "scripts/mutation_pilot.py"
      - "tests/test_mutation_pilot.py"
      - "tests/test_utils_contracts.py"
      - "tests/test_textutil.py"
      - "tests/test_atomicio.py"
      - "tests/test_atomicio_bytes_branches_wave1.py"
      - "src/sdetkit/utils/textutil.py"
      - "src/sdetkit/utils/atomicio.py"
  workflow_dispatch:
    inputs:
      target:
        description: "What to mutate"
        type: choice
        options:
          - textutil
          - atomicio
          - kvcli
          - cli
          - all
        default: textutil
  schedule:
    - cron: "0 3 * * 0"  # weekly (UTC)

permissions:
  contents: read

concurrency:
  group: mutmut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt
            requirements-docs.txt

      - name: Install
        run: |
          python -m pip install -c constraints-ci.txt -r requirements-test.txt -r requirements-docs.txt
          python -m pip install -c constraints-ci.txt -e .

      - name: Run mutation tests
        env:
          TARGET: ${{ github.event.inputs.target || 'textutil' }}
        run: |
          set -euo pipefail

          targets=("$TARGET")
          if [ "$TARGET" = all ]; then
            targets=(textutil atomicio kvcli cli)
          fi
          failed=0
          for target in "${targets[@]}"; do
            # Preserve all reports while making tool/baseline failures visible.
            if ! python scripts/mutation_pilot.py --target "$target" --out "artifacts/$target"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload mutmut report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          retention-days: 14
          name: mutmut-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn

  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pilot dependencies
        run: python -m pip install -c constraints-ci.txt -r requirements-test.txt -e .
      - name: Run focused report-only pilot
        id: mutation
        continue-on-error: true
        run: python scripts/mutation_pilot.py
      - name: Publish honest pilot summary
        if: always()
        env:
          PILOT_OUTCOME: ${{ steps.mutation.outcome }}
        run: |
          echo "Pilot step outcome: $PILOT_OUTCOME (report-only, not a merge gate)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/mutation-pilot/summary.md ]; then
            cat build/mutation-pilot/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report was produced. This is a tool/setup failure, not a mutation score.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-pilot
          path: build/mutation-pilot/
          retention-days: 14
          if-no-files-found: warn
