name: GHAS hotspot repair proof

on:
  push:
    branches: [agent/ghas-production-hotspots]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ghas-production-hotspots
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install -c constraints-ci.txt -e .[dev,test]
      - name: Apply focused hotspot repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          verifier = Path("src/sdetkit/formatter_candidate_verifier.py")
          text = verifier.read_text(encoding="utf-8")
          old = '            "all_six_scenarios_retained": len(scenarios) == 6,\n'
          new = '            "all_six_scenarios_retained": True,\n'
          if text.count(old) != 1:
              raise SystemExit("expected one redundant scenario-count comparison")
          verifier.write_text(text.replace(old, new), encoding="utf-8")

          gate = Path("src/sdetkit/gates/security_gate.py")
          text = gate.read_text(encoding="utf-8")
          helper_old = '''def _looks_like_hex_digest(token: str) -> bool:\n    n = len(token)\n    if n not in {24, 32, 40, 48, 56, 64}:\n        return False\n    return re.fullmatch(r"[0-9a-f]+", token) is not None\n'''
          helper_new = helper_old + '''\n\ndef _looks_like_boolean_assignment(token: str) -> bool:\n    return (\n        re.fullmatch(\n            r"[A-Za-z_][A-Za-z0-9_]*=(?:true|false)", token, re.IGNORECASE\n        )\n        is not None\n    )\n'''
          if text.count(helper_old) != 1:
              raise SystemExit("expected one hex-digest helper block")
          text = text.replace(helper_old, helper_new)
          scan_old = '''            if _looks_like_hex_digest(token):\n                continue\n            if _entropy(token) >= 4.0 and not token.isdigit():\n'''
          scan_new = '''            if _looks_like_hex_digest(token):\n                continue\n            if _looks_like_boolean_assignment(token):\n                continue\n            if _entropy(token) >= 4.0 and not token.isdigit():\n'''
          if text.count(scan_old) != 1:
              raise SystemExit("expected one high-entropy filter block")
          gate.write_text(text.replace(scan_old, scan_new), encoding="utf-8")

          security_tests = Path("tests/test_security_gate_cli.py")
          security_text = security_tests.read_text(encoding="utf-8")
          security_test = '''\n\ndef test_security_scan_ignores_boolean_policy_assignment_but_detects_token(\n    tmp_path: Path,\n    capsys,\n) -> None:\n    token = "".join(("AbCdEfGh", "IjKlMnOp", "QrStUvWx", "Yz012345"))\n    target = tmp_path / "policy.txt"\n    target.write_text(\n        f'policy = "publication_authorized=false"\\nsecret = "{token}"\\n',\n        encoding="utf-8",\n    )\n\n    assert _run(["scan", "--root", str(tmp_path), "--format", "json", "--fail-on", "none"]) == 0\n    payload = json.loads(capsys.readouterr().out)\n    findings = [\n        item for item in payload["findings"] if item["rule_id"] == "SEC_HIGH_ENTROPY_STRING"\n    ]\n\n    assert len(findings) == 1\n    assert findings[0]["path"] == "policy.txt"\n    assert findings[0]["line"] == 2\n'''
          if "test_security_scan_ignores_boolean_policy_assignment_but_detects_token" not in security_text:
              security_tests.write_text(security_text.rstrip() + security_test + "\n", encoding="utf-8")

          verifier_tests = Path("tests/test_formatter_candidate_verifier.py")
          verifier_text = verifier_tests.read_text(encoding="utf-8")
          verifier_test = '''\n\ndef test_formatter_candidate_verifier_rejects_missing_required_scenario(tmp_path: Path) -> None:\n    benchmark_dir = _build_packet(tmp_path)\n    evidence = json.loads((benchmark_dir / benchmark.EVIDENCE_JSON).read_text(encoding="utf-8"))\n    del evidence["scenarios"]["rollback"]\n\n    with pytest.raises(ValueError, match="required six scenarios"):\n        verifier._scenario_payloads(benchmark_dir, evidence)\n'''
          if "test_formatter_candidate_verifier_rejects_missing_required_scenario" not in verifier_text:
              verifier_tests.write_text(verifier_text.rstrip() + verifier_test + "\n", encoding="utf-8")
          PY
      - name: Format and lint focused changes
        run: |
          python -m ruff format src/sdetkit/formatter_candidate_verifier.py src/sdetkit/gates/security_gate.py tests/test_formatter_candidate_verifier.py tests/test_security_gate_cli.py
          python -m ruff check src/sdetkit/formatter_candidate_verifier.py src/sdetkit/gates/security_gate.py tests/test_formatter_candidate_verifier.py tests/test_security_gate_cli.py
      - name: Run focused regression proof
        run: |
          python -m pytest -q tests/test_formatter_candidate_verifier.py tests/test_security_gate_cli.py
      - name: Verify production hotspot scan
        run: |
          python -m sdetkit security scan --root . --format json --fail-on none > /tmp/security-scan.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/security-scan.json").read_text(encoding="utf-8"))
          blocked = {
              ("SEC_HIGH_ENTROPY_STRING", "src/sdetkit/product_maturity_radar_portfolio.py"),
          }
          observed = {(item["rule_id"], item["path"]) for item in data.get("findings", [])}
          unexpected = sorted(blocked & observed)
          if unexpected:
              raise SystemExit(f"hotspot scanner finding remains: {unexpected}")
          PY
      - name: Commit verified repair and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ghas-hotspot-repair.yml
          git add src/sdetkit/formatter_candidate_verifier.py src/sdetkit/gates/security_gate.py tests/test_formatter_candidate_verifier.py tests/test_security_gate_cli.py
          git commit -m "fix(security): resolve production hotspot findings"
          git push origin HEAD:agent/ghas-production-hotspots
