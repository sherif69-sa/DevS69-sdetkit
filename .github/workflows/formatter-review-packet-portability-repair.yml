name: Formatter review packet portability repair

on:
  push:
    branches: [agent/formatter-proposal-review-packet]

permissions:
  contents: write

jobs:
  repair-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/formatter-proposal-review-packet
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Repair retained packet provenance
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          from sdetkit import remediation_research_contract

          packet = Path("docs/evidence/formatter-policy-proposal/review-packet-2141")
          benchmark_root = packet / "benchmark"
          benchmark_json = benchmark_root / "formatter-candidate-benchmark.json"
          evidence_json = benchmark_root / "remediation-research-evidence.json"
          report_json = benchmark_root / "remediation-research-report.json"
          contract_json = Path("docs/contracts/remediation-research.v1.json")
          manifest_json = packet / "review-packet-manifest.json"
          test_file = Path("tests/test_formatter_policy_proposal_review_packet.py")

          def load(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def dump(path: Path, payload):
              path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def retained(name: str) -> str:
              return (benchmark_root / name).as_posix()

          benchmark = load(benchmark_json)
          benchmark["artifacts"] = {
              "benchmark_json": retained("formatter-candidate-benchmark.json"),
              "benchmark_markdown": retained("formatter-candidate-benchmark.md"),
              "contract_report_json": retained("remediation-research-report.json"),
              "contract_report_markdown": retained("remediation-research-report.md"),
              "evidence_json": retained("remediation-research-evidence.json"),
          }
          dump(benchmark_json, benchmark)

          evidence = load(evidence_json)
          evidence["focused_proof"]["artifacts"][0]["path"] = retained("focused-proof.json")
          evidence["full_proof"]["artifacts"][0]["path"] = retained("full-proof.json")
          evidence["proposed_diff"]["artifact_path"] = retained("proposed.diff")
          evidence["rollback"]["artifact_path"] = retained("rollback.json")
          for scenario_id, scenario in evidence["scenarios"].items():
              scenario["artifact_path"] = retained(f"scenario-{scenario_id}.json")
          dump(evidence_json, evidence)

          report = remediation_research_contract.build_report(
              evidence_json,
              contract_json=contract_json,
              root=".",
          )
          dump(report_json, report)

          test_text = test_file.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "from sdetkit import formatter_policy_proposal\n",
              "from sdetkit import formatter_policy_proposal, remediation_research_contract\n",
          )
          marker = 'VERIFIER_REPORT = PACKET_ROOT / "verifier" / "formatter-candidate-verifier.json"\n'
          constants = (
              'BENCHMARK_ROOT = PACKET_ROOT / "benchmark"\n'
              'BENCHMARK_REPORT = BENCHMARK_ROOT / "formatter-candidate-benchmark.json"\n'
              'REMEDIATION_EVIDENCE = BENCHMARK_ROOT / "remediation-research-evidence.json"\n'
              'REMEDIATION_REPORT = BENCHMARK_ROOT / "remediation-research-report.json"\n'
              'REMEDIATION_CONTRACT = Path("docs/contracts/remediation-research.v1.json")\n'
          )
          if "BENCHMARK_ROOT = PACKET_ROOT" not in test_text:
              test_text = test_text.replace(marker, marker + constants)

          portability_test = r'''

          def test_formatter_policy_proposal_review_packet_binds_all_benchmark_paths() -> None:
              benchmark = _load(BENCHMARK_REPORT)
              evidence = _load(REMEDIATION_EVIDENCE)
              report = _load(REMEDIATION_REPORT)

              retained_prefix = f"{BENCHMARK_ROOT.as_posix()}/"
              referenced_paths = list(benchmark["artifacts"].values())
              referenced_paths.extend(
                  artifact["path"] for artifact in evidence["focused_proof"]["artifacts"]
              )
              referenced_paths.extend(
                  artifact["path"] for artifact in evidence["full_proof"]["artifacts"]
              )
              referenced_paths.extend(
                  [
                      evidence["proposed_diff"]["artifact_path"],
                      evidence["rollback"]["artifact_path"],
                  ]
              )
              referenced_paths.extend(
                  scenario["artifact_path"] for scenario in evidence["scenarios"].values()
              )

              assert referenced_paths
              assert all(path.startswith(retained_prefix) for path in referenced_paths)
              assert all(Path(path).is_file() for path in referenced_paths)
              assert all("build/formatter-candidate-benchmark/" not in path for path in referenced_paths)
              assert all(not Path(path).is_absolute() for path in referenced_paths)

              expected_provenance = remediation_research_contract.input_provenance(
                  REMEDIATION_EVIDENCE,
                  contract_json=REMEDIATION_CONTRACT,
                  root=".",
              )
              assert report["input_provenance"] == expected_provenance

              contract = _load(REMEDIATION_CONTRACT)
              normalized, errors = remediation_research_contract.normalize_evidence(evidence, contract)
              assert errors == []
              assert report["normalized_evidence"] == normalized
          '''
          if "test_formatter_policy_proposal_review_packet_binds_all_benchmark_paths" not in test_text:
              test_text = test_text.rstrip() + portability_test + "\n"
          test_file.write_text(test_text, encoding="utf-8")

          manifest = load(manifest_json)

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          retained_files = {
              path.relative_to(packet).as_posix(): sha256(path)
              for path in sorted(packet.rglob("*"))
              if path.is_file() and path != manifest_json
          }
          manifest["artifact_count"] = len(retained_files)
          manifest["artifact_digests"] = retained_files
          manifest["proposal_sha256"] = sha256(packet / "formatter-policy-proposal.json")
          manifest["proposal_markdown_sha256"] = sha256(packet / "formatter-policy-proposal.md")
          manifest["review_checklist_sha256"] = sha256(packet / "review-checklist.md")
          dump(manifest_json, manifest)
          PY

      - name: Format and verify focused contract
        run: |
          python -m pip install -c constraints-ci.txt ruff pytest
          python -m ruff format tests/test_formatter_policy_proposal_review_packet.py
          python -m ruff check tests/test_formatter_policy_proposal_review_packet.py
          python -m ruff format --check tests/test_formatter_policy_proposal_review_packet.py
          PYTHONPATH=src python -m pytest -q tests/test_formatter_policy_proposal_review_packet.py -o addopts=

      - name: Refresh manifest after test-independent packet verification
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          packet = Path("docs/evidence/formatter-policy-proposal/review-packet-2141")
          manifest_path = packet / "review-packet-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          retained = {
              path.relative_to(packet).as_posix(): sha256(path)
              for path in sorted(packet.rglob("*"))
              if path.is_file() and path != manifest_path
          }
          manifest["artifact_count"] = len(retained)
          manifest["artifact_digests"] = retained
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH=src python -m pytest -q tests/test_formatter_policy_proposal_review_packet.py -o addopts=

      - name: Commit repaired packet and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/formatter-review-packet-portability-repair.yml
          git add docs/evidence/formatter-policy-proposal/review-packet-2141 tests/test_formatter_policy_proposal_review_packet.py
          git commit -m "fix(product): retain portable benchmark evidence paths"
          git push origin HEAD:agent/formatter-proposal-review-packet
