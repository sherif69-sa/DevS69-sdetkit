# Temporary branch-only proof. Remove before merge.
name: Permission Review Finding Repair

on:
  push:
    branches:
      - agent/workflow-permission-decision-record-v1

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-ci.txt
            pyproject.toml
            requirements*.txt
      - name: Install project
        run: |
          python -m pip install -c constraints-ci.txt --upgrade pip
          python -m pip install -c constraints-ci.txt -e '.[dev,test]'
      - name: Replace synthetic review id fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_workflow_permission_decision_record.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _review_entry() -> dict[str, object]:
    return {
        "review_id": "wpr-0123456789abcdef",
        "workflow": ".github/workflows/security-maintenance-bot.yml",
        "workflow_sha256": "a" * 64,
        "permission_group": "security_upload",
    }
'''
          new = '''def _review_entry() -> dict[str, object]:
    workflow = ".github/workflows/security-maintenance-bot.yml"
    return {
        "review_id": decision_record.review_id_for_workflow(workflow),
        "workflow": workflow,
        "workflow_sha256": "a" * 64,
        "permission_group": "security_upload",
    }
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('expected synthetic review fixture not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Ruff format and check
        run: |
          python -m ruff format \
            src/sdetkit/workflow_permission_decision_record.py \
            src/sdetkit/workflow_permission_review_control_plane.py \
            tests/test_workflow_permission_decision_record.py \
            tests/test_workflow_permission_review_control_plane.py
          python -m ruff check \
            src/sdetkit/workflow_permission_decision_record.py \
            src/sdetkit/workflow_permission_review_control_plane.py \
            tests/test_workflow_permission_decision_record.py \
            tests/test_workflow_permission_review_control_plane.py
      - name: Explicit mypy lane
        run: |
          python -m mypy \
            src/sdetkit/workflow_permission_decision_record.py \
            src/sdetkit/workflow_permission_review_control_plane.py
      - name: Focused governance tests
        run: |
          python -m pytest -q \
            tests/test_workflow_permission_decision_record.py \
            tests/test_workflow_permission_review_control_plane.py \
            tests/test_quality_truth_baseline.py \
            -o addopts=
      - name: Prove both CLIs without cyclic import
        run: |
          python -m sdetkit.workflow_permission_decision_record --root . --format text --fail-on-invalid
          python -m sdetkit.workflow_permission_review_control_plane \
            --root . \
            --out /tmp/control-plane.json \
            --markdown-out /tmp/control-plane.md \
            --format text >/tmp/control-plane.txt
          grep -q 'workflow_mutation_allowed: false' /tmp/control-plane.md
      - name: Commit proven product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sdetkit/workflow_permission_decision_record.py \
            tests/test_workflow_permission_decision_record.py
          if git diff --cached --quiet; then
            echo 'no_product_change=true'
            exit 0
          fi
          git commit -m "fix(governance): close permission decision review findings"
          git push origin HEAD:agent/workflow-permission-decision-record-v1
