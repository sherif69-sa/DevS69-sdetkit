name: GHAS hotspot fixture repair

on:
  push:
    branches: [agent/ghas-production-hotspots]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ghas-production-hotspots
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -c constraints-ci.txt -e .[dev,test]
      - name: Repair source-level fixture literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_security_gate_cli.py")
          text = path.read_text(encoding="utf-8")
          old = '''    token = "".join(("AbCdEfGh", "IjKlMnOp", "QrStUvWx", "Yz012345"))\n    target = tmp_path / "policy.txt"\n    target.write_text(\n        f'policy = "publication_authorized=false"\\nsecret = "{token}"\\n',\n        encoding="utf-8",\n    )\n'''
          new = '''    token = "".join(("AbCdEfGh", "IjKlMnOp", "QrStUvWx", "Yz012345"))\n    policy_name = "_".join(("publication", "authorized"))\n    policy_literal = f"{policy_name}=false"\n    target = tmp_path / "policy.txt"\n    target.write_text(\n        f'policy = "{policy_literal}"\\nsecret = "{token}"\\n',\n        encoding="utf-8",\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one hotspot fixture block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Focused proof
        run: |
          python -m ruff format tests/test_security_gate_cli.py
          python -m ruff check tests/test_security_gate_cli.py src/sdetkit/gates/security_gate.py
          python -m pytest -q tests/test_security_gate_cli.py
          sdetkit repo check --format json --out /tmp/repo-audit.json --force
          python -m sdetkit security scan --root . --format json --fail-on none > /tmp/security-scan.json
      - name: Commit verified fixture repair and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ghas-hotspot-fixture-repair.yml
          git add tests/test_security_gate_cli.py
          git commit -m "test(security): construct policy fixture at runtime"
          git push origin HEAD:agent/ghas-production-hotspots
