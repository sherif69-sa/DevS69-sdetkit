version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "automation"
    commit-message:
      prefix: "chore(deps-actions)"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:30"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "chore(deps-pip)"
    groups:
      python-dependencies:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
    ignore:
      # These docs updates require Python >=3.11.5, but we support >=3.11.
      # Revisit with an explicit support-policy decision, not an automatic bump.
      - dependency-name: "mkdocs-material"
        versions: [">=9.8.2"]
      - dependency-name: "pymdown-extensions"
        versions: [">=13"]
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
