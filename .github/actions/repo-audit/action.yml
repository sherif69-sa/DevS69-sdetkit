name: sdetkit repo audit
description: Run sdetkit repo audit with SARIF upload, step summary, and JSON artifact options.

inputs:
  path:
    description: Repository path to audit.
    default: "."
  profile:
    description: Audit profile.
    default: "default"
  fail_on:
    description: Severity threshold that fails the step.
    default: "warn"
  python_version:
    description: Python version used for audit tooling.
    default: "3.12"
  sdetkit_version:
    description: Install this sdetkit version from PyPI instead of the action's own source.
    default: ""
  upload_sarif:
    description: Upload SARIF report to GitHub code scanning.
    default: "true"
  sarif_path:
    description: Path to write SARIF output.
    default: "sdetkit-audit.sarif.json"
  write_summary:
    description: Append a markdown summary to GITHUB_STEP_SUMMARY.
    default: "true"
  output_json:
    description: Write JSON report.
    default: "true"
  json_path:
    description: Path to write JSON output.
    default: "sdetkit-audit.json"
  upload_json:
    description: Upload JSON report as a workflow artifact.
    default: "true"
  json_artifact_name:
    description: Artifact name for uploaded JSON report.
    default: "sdetkit-audit-json"

runs:
  using: composite
  steps:
    # The caller checks the repository out first: a workflow cannot load a local action
    # before that, and checking out again here would discard the caller's changes.
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install sdetkit
      id: install
      shell: bash
      env:
        SDETKIT_VERSION: ${{ inputs.sdetkit_version }}
      run: |
        set -euo pipefail
        # sdetkit gets its own environment, installed from this action's source (the
        # repository root, three levels up), so the audited project is never installed
        # in its place and its dependencies are left alone.
        venv="$RUNNER_TEMP/sdetkit-repo-audit-venv"
        python -m venv "$venv"
        sdetkit_python="$venv/bin/python"
        [ -x "$sdetkit_python" ] || sdetkit_python="$venv/Scripts/python.exe"
        if [ -n "$SDETKIT_VERSION" ]; then
          source="sdetkit==$SDETKIT_VERSION"
        else
          source="$GITHUB_ACTION_PATH/../../.."
        fi
        "$sdetkit_python" -m pip install --quiet --disable-pip-version-check "$source"
        echo "sdetkit-python=$sdetkit_python" >> "$GITHUB_OUTPUT"

    - name: Run sdetkit repo audit
      shell: bash
      env:
        SDETKIT_PYTHON: ${{ steps.install.outputs.sdetkit-python }}
        AUDIT_PATH: ${{ inputs.path }}
        AUDIT_PROFILE: ${{ inputs.profile }}
        AUDIT_FAIL_ON: ${{ inputs.fail_on }}
        AUDIT_SARIF_PATH: ${{ inputs.sarif_path }}
        AUDIT_OUTPUT_JSON: ${{ inputs.output_json }}
        AUDIT_JSON_PATH: ${{ inputs.json_path }}
      run: |
        set -euo pipefail
        mkdir -p .sdetkit-action
        audit() { "$SDETKIT_PYTHON" -m sdetkit repo audit "$AUDIT_PATH" --profile "$AUDIT_PROFILE" "$@"; }

        audit --format text --fail-on none > .sdetkit-action/audit.txt
        audit --format json --output .sdetkit-action/audit-summary.json --fail-on none --force
        if [ "$AUDIT_OUTPUT_JSON" = "true" ]; then
          cp .sdetkit-action/audit-summary.json "$AUDIT_JSON_PATH"
        fi
        audit --format sarif --output "$AUDIT_SARIF_PATH" --fail-on "$AUDIT_FAIL_ON" --force

    - name: Write step summary
      if: ${{ always() && inputs.write_summary == 'true' }}
      shell: bash
      env:
        SDETKIT_PYTHON: ${{ steps.install.outputs.sdetkit-python }}
        AUDIT_FAIL_ON: ${{ inputs.fail_on }}
        AUDIT_PROFILE: ${{ inputs.profile }}
        AUDIT_UPLOAD_SARIF: ${{ inputs.upload_sarif }}
        AUDIT_OUTPUT_JSON: ${{ inputs.output_json }}
        AUDIT_UPLOAD_JSON: ${{ inputs.upload_json }}
        AUDIT_JSON_ARTIFACT_NAME: ${{ inputs.json_artifact_name }}
      run: |
        set -euo pipefail
        [ -f .sdetkit-action/audit-summary.json ] || exit 0
        "$SDETKIT_PYTHON" - <<'PY'
        import json
        import os
        from pathlib import Path

        summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
        payload = json.loads(Path(".sdetkit-action/audit-summary.json").read_text(encoding="utf-8"))
        counts = payload.get("summary", {}).get("counts", {})
        findings = payload.get("findings", [])

        lines = [
            "## sdetkit repo audit",
            "",
            f"- Profile: `{os.environ['AUDIT_PROFILE']}`",
            f"- Fail policy: `{os.environ['AUDIT_FAIL_ON']}`",
            f"- Findings: {payload.get('summary', {}).get('findings', 0)}",
            (
                "- Severity counts: "
                f"info={counts.get('info', 0)}, "
                f"warn={counts.get('warn', 0)}, "
                f"error={counts.get('error', 0)}"
            ),
            "",
            "### Top findings",
        ]

        if findings:
            lines.append("| Severity | Check | Code | Path | Message |")
            lines.append("| --- | --- | --- | --- | --- |")
            for item in findings[:10]:
                sev = str(item.get("severity", "")).replace("|", "\\|")
                check = str(item.get("check", "")).replace("|", "\\|")
                code = str(item.get("code", "")).replace("|", "\\|")
                path = str(item.get("path", "")).replace("|", "\\|")
                message = str(item.get("message", "")).replace("|", "\\|")
                lines.append(f"| {sev} | {check} | {code} | `{path}` | {message} |")
        else:
            lines.append("No findings.")

        lines.append("")
        lines.append("### Notes")
        if os.environ["AUDIT_UPLOAD_SARIF"] == "true":
            lines.append("- SARIF uploaded to **Security → Code scanning alerts**.")
        else:
            lines.append("- SARIF upload disabled.")

        if os.environ["AUDIT_OUTPUT_JSON"] == "true" and os.environ["AUDIT_UPLOAD_JSON"] == "true":
            lines.append(
                f"- JSON report uploaded as artifact: `{os.environ['AUDIT_JSON_ARTIFACT_NAME']}`."
            )
        elif os.environ["AUDIT_OUTPUT_JSON"] == "true":
            lines.append("- JSON report generated locally but artifact upload is disabled.")
        else:
            lines.append("- JSON report generation disabled.")

        with summary_path.open("a", encoding="utf-8") as fh:
            fh.write("\n".join(lines) + "\n")
        PY

    - name: Upload SARIF
      if: ${{ always() && inputs.upload_sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
      with:
        sarif_file: ${{ inputs.sarif_path }}

    - name: Upload JSON report artifact
      if: ${{ always() && inputs.upload_json == 'true' && inputs.output_json == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.json_artifact_name }}
        path: ${{ inputs.json_path }}
